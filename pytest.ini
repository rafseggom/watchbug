[tool:pytest]
# Configuración de pytest para Watchbug

# Donde buscar tests
testpaths = tests

# Patron de archivos de test
python_files = test_*.py

# Patron de clases de test
python_classes = Test*

# Patron de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers personalizados
markers =
    integration: Tests de integración end-to-end
    slow: Tests que tardan más de 1 segundo
    flask: Tests que requieren Flask
    django: Tests que requieren Django
    fastapi: Tests que requieren FastAPI
    supabase: Tests que requieren conexión con Supabase

# Coverage
[coverage:run]
source = watchbug
omit =
    */tests/*
    */examples/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
